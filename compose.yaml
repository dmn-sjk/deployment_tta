# Usage (after creating .env, see README: Setup):
#   docker compose build
#   docker compose run --rm tta                     # interactive shell
#   docker compose run --rm tta python -m pytest    # one-off command
name: deployment_tta

services:
  tta:
    build:
      context: docker
    image: deployment_tta:24.08
    init: true
    user: "${HOST_UID:?set in .env}:${HOST_GID:?set in .env}"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      DATA_DIR: /data
      HOME: /data/home
      USER: ${USER:-tta}
    volumes:
      - .:/workspace/deployment_tta
      # Fixed container path, so code and configs never contain host paths.
      - ${HOST_DATA_DIR:?set in .env}:/data
    working_dir: /workspace/deployment_tta
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU:-0}"]
              capabilities: [gpu]
    command: bash
