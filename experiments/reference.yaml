# The reference (PyTorch FP32, deterministic): the reported accuracy.
# A live (B, S) has a reported accuracy only if it has a reference run.
experiment: reference
grids:
  tent: &tent
    - {B: 1, S: 1}
    - {B: 16, S: 1}
    - {B: 64, S: 1}
    - {B: 16, S: 2}
    - {B: 16, S: 8}
runs:
  - {source: true}
  - {tent: *tent}
